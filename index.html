<style>
@font-face{font-family:IskraSerif;src:url('loading-serif.ttf') format('truetype');font-display:swap}
:root{color-scheme:dark;--gold:#efc77d;--cream:#fff1cf}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#111c22;overflow:hidden;font-family:IskraSerif,Georgia,serif;color:var(--cream)}
[hidden]{display:none!important}#canvas{display:block;width:100%;height:100%;outline:0;touch-action:none}
#loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;text-align:center;background:#101b20;isolation:isolate;padding:22px;overflow:hidden}
#loading:before{content:"";position:absolute;inset:-2%;z-index:-2;background:linear-gradient(180deg,#07121b88,#0b1618b0 55%,#0b1118f7),url('loading-forest.png') center/cover;animation:forest-reveal 8s ease-out both}
#loading:after{content:"";position:absolute;inset:14px;border:1px solid #dfb86c45;pointer-events:none}
.load-card{width:min(100%,460px);position:relative;padding:20px 5px}.eyebrow{font:600 11px/1.5 Arial,sans-serif;letter-spacing:.27em;color:#dec795;text-transform:uppercase;margin:0 0 14px}
.load-title{font-size:clamp(46px,11vw,74px);line-height:1;letter-spacing:.16em;margin:0 0 10px;padding-left:.16em;color:#ffe9ad;text-shadow:0 0 38px #efa13866,0 2px 2px #000}
.subtitle{font-size:16px;letter-spacing:.14em;margin:0;color:#d5c9b0}.ornament{margin:19px auto 5px;display:flex;align-items:center;gap:13px;width:160px;color:var(--gold)}.ornament:before,.ornament:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#ca9e57)}.ornament:after{transform:rotate(180deg)}
.hero-scene{position:relative;width:min(100%,350px);aspect-ratio:460/341;margin:0 auto 14px}.hero-scene:before{content:"";position:absolute;inset:20% 16% 8%;border-radius:50%;background:radial-gradient(ellipse,#ffb55244,transparent 68%);filter:blur(12px)}
.loader-hero{position:absolute;inset:0;background:url('loading-hero.png') 0 9.052%/278.261% 375.367% no-repeat;animation:hero-breathe 3.5s ease-in-out infinite;filter:drop-shadow(0 9px 18px #0009)}
.ember{position:absolute;width:3px;height:3px;background:#ffd27d;border-radius:50%;box-shadow:0 0 9px #ff9e35;animation:ember-rise 4s linear infinite}.ember:nth-child(2){left:27%;bottom:10%;animation-delay:-1s}.ember:nth-child(3){left:63%;bottom:18%;animation-delay:-2.6s}.ember:nth-child(4){left:78%;bottom:30%;animation-delay:-3.4s}.ember:nth-child(5){left:38%;bottom:4%;animation-delay:-.4s}
#status{font-size:14px;min-height:40px;line-height:1.6;margin:0 0 14px;color:#ede0c2}.progress-track{position:relative;height:10px;width:min(100%,310px);padding:2px;margin:0 auto;border:1px solid #b6935366;background:#080d1299;border-radius:2px}.progress-track:before,.progress-track:after{content:"◆";position:absolute;top:-6px;color:#c49a59;font-size:13px}.progress-track:before{left:-12px}.progress-track:after{right:-12px}#fill{height:100%;width:0;background:linear-gradient(90deg,#88520d,#efb84d,#fff1bd);box-shadow:0 0 10px #f5c46a66;transition:width .25s ease}
.load-hint{font:12px/1.6 Arial,sans-serif;color:#a5b4ad;max-width:320px;margin:23px auto 0}.load-hint strong{font-weight:400;color:#dcc692}#error{margin:20px auto 0;max-width:310px;font:14px/1.5 Arial,sans-serif;color:#f4dbc0}.gold-button{font:600 14px Arial,sans-serif;border:1px solid #d9b66d;background:linear-gradient(#d1a453,#916424);color:#211609;padding:12px 23px;border-radius:3px;margin-top:13px;cursor:pointer}
#ad-break{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#071016dc;backdrop-filter:blur(5px);padding:24px;touch-action:none}.ad-card{width:min(100%,350px);padding:35px 25px 27px;text-align:center;border:1px solid #b79151;background:linear-gradient(150deg,#243039,#101a21);box-shadow:0 0 0 6px #121b2188,0 24px 70px #0008;position:relative}.ad-card:before{content:"◆";position:absolute;top:-12px;left:calc(50% - 8px);color:var(--gold);background:#18242b;padding:0 4px;font-size:17px}#ad-title{font-size:23px;margin:0;color:#ffe3a6}#ad-count{font-size:82px;line-height:1.2;color:#ffd77e;text-shadow:0 0 25px #ffae4d44;margin:12px 0}.ad-caption{font:13px/1.7 Arial,sans-serif;color:#b9c6c3;margin:0}
@keyframes forest-reveal{from{transform:scale(1.06)}to{transform:scale(1)}}@keyframes hero-breathe{50%{transform:translateY(-6px)}}@keyframes ember-rise{0%{opacity:0;transform:translateY(0)}20%{opacity:.8}100%{opacity:0;transform:translate(15px,-95px)}}
@media(max-height:650px){.load-card{max-width:340px;padding:8px}.eyebrow{margin-bottom:8px}.load-title{font-size:42px}.subtitle{font-size:13px}.ornament{margin:12px auto 0}.hero-scene{width:190px;margin-bottom:7px}.load-hint{margin-top:16px}#status{margin-bottom:7px;min-height:30px;font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="canvas" tabindex="0">Для игры нужен браузер с WebGL 2.</canvas>
<section id="loading" aria-label="Загрузка игры">
  <div class="load-card">
    <p class="eyebrow">Легенда начинается с тебя</p>
    <h1 class="load-title">ИСКРА</h1><p class="subtitle">ПУТЬ ГЕРОЯ</p>
    <div class="ornament" aria-hidden="true">◆</div>
    <div class="hero-scene" aria-hidden="true"><div class="loader-hero"></div><i class="ember"></i><i class="ember"></i><i class="ember"></i><i class="ember"></i></div>
    <p id="status" role="status">Разжигаем Искру…</p>
    <div id="loading-progress" class="progress-track" role="progressbar" aria-label="Загрузка мира" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div>
    <p class="load-hint"><strong>Собери отряд. Пробуди древнюю силу.</strong></p>
    <div id="error" hidden>Мир не загрузился. Проверь соединение и попробуй ещё раз.<br><button id="retry" class="gold-button">Попробовать снова</button><br><button id="base-version" class="gold-button">Запустить встроенную версию</button></div>
  </div>
</section>
<div id="ad-break" role="dialog" aria-modal="true" aria-labelledby="ad-title" hidden><div class="ad-card"><h2 id="ad-title">Реклама через</h2><div id="ad-count" role="status" aria-live="polite">3</div><p class="ad-caption">Игра на паузе.<br>Твой прогресс сохранён.</p></div></div>
